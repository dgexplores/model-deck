services:
  - type: web
    name: dg-model-deck
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
